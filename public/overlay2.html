<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Perú Comunidad - Stream Overlay</title>
  <!-- Google Fonts: Rajdhani & Inter for aggressive Esports typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff5500;
      --primary-gold: #e5a93c;
      --peru-red: #e61e2a;
      --accent-cyan: #00d2ff;
      --bg-dark-1: rgba(14, 16, 21, 0.94);
      --bg-dark-2: rgba(8, 9, 12, 0.98);
      --border-color: rgba(255, 255, 255, 0.12);
      --win-color: #00e676;
      --loss-color: #ff3d57;
      --text-muted: #8e95a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      margin: 0;
      padding: 12px;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Rajdhani', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: inline-block;
    }

    /* Contenedor Principal Esports */
    .overlay-card {
      width: 440px;
      background: linear-gradient(145deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 
                  0 0 20px rgba(230, 30, 42, 0.15),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Línea decorativa superior: Colores Perú + CS2 */
    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, 
        var(--peru-red) 0%, 
        #ffffff 25%, 
        var(--peru-red) 50%, 
        var(--primary-orange) 75%, 
        var(--primary-gold) 100%
      );
      box-shadow: 0 0 10px rgba(230, 30, 42, 0.6);
    }

    /* Marca de agua / Brillo de fondo */
    .overlay-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 85, 0, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER: Logo de la comunidad + Nombre de Cola / Temporada + Badge LIVE */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .community-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .community-logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 12px rgba(230, 30, 42, 0.5), 0 0 2px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 1.5px solid var(--primary-gold);
      position: relative;
    }

    .community-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text-block {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-title span {
      color: var(--primary-orange);
    }

    .hub-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(230, 30, 42, 0.15);
      border: 1px solid rgba(230, 30, 42, 0.4);
      padding: 2px 7px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 800;
      color: #ff5263;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--peru-red);
      box-shadow: 0 0 8px var(--peru-red);
      animation: pulseLive 1.8s infinite;
    }

    @keyframes pulseLive {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* FILA JUGADOR: Avatar + Nickname + Nivel Faceit + Ranking */
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .player-main-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .avatar-ring {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-gold), var(--peru-red));
      padding: 2px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .avatar-box {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1a1d24;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #14171d;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-box .fallback {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    /* Badge de Nivel Faceit */
    .level-badge {
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #111;
      border: 1.5px solid #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    .player-names-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-nickname {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-tag {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Puesto / Ranking */
    .rank-badge-card {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 85, 0, 0.12), rgba(230, 30, 42, 0.08));
      border: 1px solid rgba(255, 85, 0, 0.35);
      border-radius: 8px;
      padding: 4px 10px;
      min-width: 76px;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.1);
    }

    .rank-label-small {
      font-family: 'Inter', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rank-number {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 0%, var(--primary-gold) 60%, var(--primary-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }

    /* GRID DE ESTADÍSTICAS */
    .stats-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.1fr 1.1fr;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-pill:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Puntos Highlight */
    .stat-pill.points-highlight {
      background: linear-gradient(135deg, rgba(229, 169, 60, 0.15), rgba(255, 85, 0, 0.1));
      border: 1px solid rgba(229, 169, 60, 0.45);
      box-shadow: inset 0 0 10px rgba(229, 169, 60, 0.1);
    }

    .stat-title {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 2px;
    }

    .stat-pill.points-highlight .stat-title {
      color: var(--primary-gold);
    }

    .stat-digit {
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
      color: #f5f5f7;
    }

    .stat-digit.points {
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
    }

    .stat-digit.winrate {
      color: var(--win-color);
      font-weight: 800;
    }

    .ratio-group {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }

    .val-won {
      color: var(--win-color);
    }

    .val-divider {
      color: rgba(255, 255, 255, 0.3);
      font-size: 13px;
    }

    .val-lost {
      color: var(--loss-color);
    }

    /* Animación al actualizar datos */
    .data-update-pulse {
      animation: flashUpdate 0.6s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    @keyframes flashUpdate {
      0% { filter: brightness(1.7); transform: scale(1.02); }
      100% { filter: brightness(1); transform: scale(1); }
    }
  </style>
</head>

        </div>
      </div>

      <div class="rank-badge-card">
        <span class="rank-label-small">POSICIÓN</span>
        <span class="rank-number" id="player-rank">#-</span>
      </div>
    </div>

    <!-- Grid de Métricas Principales -->
    <div class="stats-grid">
      <div class="stat-pill points-highlight">
        <span class="stat-title">PUNTOS</span>
        <span class="stat-digit points" id="player-points">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-title">PARTIDAS</span>
        <span class="stat-digit" id="player-played">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-title">WIN RATE</span>
        <span class="stat-digit winrate" id="player-winrate">0%</span>
      </div>
      <div class="stat-pill">
        <span class="stat-title">V / D</span>
        <div class="ratio-group">
          <span class="val-won" id="player-won">0</span>
          <span class="val-divider">/</span>
          <span class="val-lost" id="player-lost">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    
    const clubId = urlParams.get('club_id') || urlParams.get('clubId') || 'e72c25e6-74e5-415b-97da-e541296ff1db';
    const queueId = urlParams.get('queue_id') || urlParams.get('queueId') || 'dfbe0ffb-fc4b-47e6-b7dc-b37f89aecb8e';
    const nickname = urlParams.get('nick') || urlParams.get('nickname') || 'KickWaLLaCe';
    const customTitle = urlParams.get('title');
    const scaleParam = urlParams.get('scale');

    if (scaleParam && !isNaN(parseFloat(scaleParam))) {
      document.body.style.transform = `scale(${parseFloat(scaleParam)})`;
      document.body.style.transformOrigin = 'top left';
    }

    const API_URL = `/api/points?club_id=${encodeURIComponent(clubId)}&queue_id=${encodeURIComponent(queueId)}&nickname=${encodeURIComponent(nickname)}`;
    const POLL_INTERVAL = 30000; // 30 segundos para refresco en directo

    const overlayContainer = document.getElementById('overlay-container');
    const hubTitleEl = document.getElementById('hub-title');
    const avatarBox = document.getElementById('avatar-box');
    const rankEl = document.getElementById('player-rank');
    const nameEl = document.getElementById('player-name');
    const levelBadge = document.getElementById('level-badge');
    const pointsEl = document.getElementById('player-points');
    const playedEl = document.getElementById('player-played');
    const winrateEl = document.getElementById('player-winrate');
    const wonEl = document.getElementById('player-won');
    const lostEl = document.getElementById('player-lost');

    function renderAvatar(avatarUrl, userNick) {
      if (avatarUrl && avatarUrl !== 'https://cdn.discordapp.com/embed/avatars/0.png') {
        const img = new Image();
        img.src = avatarUrl;
        img.onload = () => {
          avatarBox.innerHTML = `<img src="${avatarUrl}" alt="${userNick}">`;
        };
        img.onerror = () => {
          fallbackAvatar(userNick);
        };
      } else {
        fallbackAvatar(userNick);
      }
    }

    function fallbackAvatar(userNick) {
      const initials = (userNick || 'PE').substring(0, 2).toUpperCase();
      avatarBox.innerHTML = `<span class="fallback">${initials}</span>`;
    }

    function getLevelColor(level) {
      const colors = {
        1: '#eeeeee',
        2: '#4ade80',
        3: '#4ade80',
        4: '#facc15',
        5: '#facc15',
        6: '#facc15',
        7: '#facc15',
        8: '#fb923c',
        9: '#fb923c',
        10: '#ef4444'
      };
      return colors[level] || '#ff5500';
    }

    function setSkillLevel(level) {
      if (level && level >= 1 && level <= 10) {
        levelBadge.style.display = 'flex';
        levelBadge.style.borderColor = getLevelColor(level);
        levelBadge.innerText = level;
      } else {
        levelBadge.style.display = 'none';
      }
    }

    async function updateOverlayStats() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        // Título del Hub o Temporada
        if (customTitle) {
          hubTitleEl.innerText = customTitle;
        } else if (data && data.season && data.season.leaderboard_name) {
          hubTitleEl.innerText = data.season.leaderboard_name;
        } else {
          hubTitleEl.innerText = 'TEMPORADA OFICIAL CS2';
        }

        if (data && data.player_stats) {
          const stats = data.player_stats;
          const userNick = stats.nickname || nickname;

          nameEl.innerText = userNick;
          rankEl.innerText = stats.position ? `#${stats.position}` : '#-';
          pointsEl.innerText = (stats.points ?? 0).toLocaleString();
          playedEl.innerText = stats.played ?? 0;
          winrateEl.innerText = stats.win_rate || '0%';
          wonEl.innerText = stats.won ?? 0;
          lostEl.innerText = stats.lost ?? 0;

          renderAvatar(stats.avatar, userNick);
          setSkillLevel(stats.skill_level);
        } else {
          nameEl.innerText = nickname;
          rankEl.innerText = '#-';
          pointsEl.innerText = '0';
          playedEl.innerText = '0';
          winrateEl.innerText = '0%';
          wonEl.innerText = '0';
          lostEl.innerText = '0';
          fallbackAvatar(nickname);
          setSkillLevel(null);
        }

        // Efecto suave de actualización
        overlayContainer.classList.remove('data-update-pulse');
        void overlayContainer.offsetWidth; // Trigger reflow
        overlayContainer.classList.add('data-update-pulse');

      } catch (error) {
        console.error('Error al actualizar overlay:', error);
        if (!customTitle) hubTitleEl.innerText = 'CS2 PERÚ COMUNIDAD';
      }
    }

    // Carga inicial y bucle
    updateOverlayStats();
    setInterval(updateOverlayStats, POLL_INTERVAL);
  </script>
</body>
</html>
